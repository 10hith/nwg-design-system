<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1280,initial-scale=1"/>
<title>NWG Component Library</title>
<link rel="stylesheet" href="../assets/nwg-tokens.css"/>
</head>
<body>
<div class="slide" style="width:1280px;height:720px;position:relative;overflow:hidden;background:#fff;font-family:var(--body)">
<div id="slide-01--hero-band-1" data-feedback="true" data-component="hero-band" style="position:absolute;left:0px;top:0px;width:1280px;height:720px;"><div class="nwg-hero-band" style="background:linear-gradient(135deg,rgba(61,15,102,.85),rgba(94,27,156,.55)),linear-gradient(45deg,var(--p800),var(--p500));padding:32px 44px;display:flex;flex-direction:column;justify-content:center;width:100%;height:100%;box-sizing:border-box">
    <p style="font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 10px">NatWest Group</p>
    <h1 style="font-family:var(--display);font-size:70px;font-weight:800;color:#fff;margin:0 0 12px;line-height:1.08">NWG Component Library</h1>
    <p style="font-size:22px;font-weight:700;color:rgba(255,255,255,.88);margin:0">Architecture Review · May 2025</p>
    <p style="font-size:16px;color:rgba(255,255,255,.7);margin:18px 0 0">Q2 2025</p>
  </div></div>
<div id="slide-01--arc-accent-1" data-feedback="true" data-component="arc-accent" style="position:absolute;left:816px;top:-48px;width:480px;height:480px;"><div class="nwg-arc-accent" style="pointer-events:none;overflow:hidden;width:100%;height:100%">
    <svg viewBox="0 0 400 400" fill="none" width="400" height="400" style="position:absolute;inset:0;width:100%;height:100%">
      <circle cx="200" cy="200" r="180" stroke="rgba(253,171,31,.15)" stroke-width="2"/>
      <circle cx="200" cy="200" r="110" stroke="rgba(123,44,191,.12)" stroke-width="1.5"/>
    </svg>
  </div></div>
<span class="pgnum" style="position:absolute;right:24px;bottom:18px;font-size:13px;color:var(--n500)">1</span>
</div>
</body>
</html>
