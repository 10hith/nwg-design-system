<!-- hero-band | display | Full-bleed dark purple panel with large title and gold arc accent -->
<style>
.hero-band{position:relative;background:var(--p900);color:var(--n0);padding:64px 80px 56px;overflow:hidden}
.hero-band__arc{position:absolute;right:-60px;top:-60px;width:480px;height:480px;pointer-events:none}
.hero-band__kicker{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
.hero-band__bar{width:96px;height:5px;background:var(--gold);border-radius:3px;margin:0 0 24px}
.hero-band__title{font-family:var(--display);font-size:72px;font-weight:800;line-height:1.04;color:var(--n0);margin:0 0 20px;max-width:820px}
.hero-band__sub{font-size:22px;color:var(--p200);margin:0;max-width:640px;line-height:1.45}
</style>
<!-- UX_ANNOTATION_SLOT -->
<div class="hero-band">
  <svg class="hero-band__arc" viewBox="0 0 480 480" fill="none">
    <circle cx="380" cy="100" r="280" stroke="rgba(253,171,31,.18)" stroke-width="2.5"/>
    <circle cx="380" cy="100" r="200" stroke="rgba(253,171,31,.12)" stroke-width="1.5"/>
    <circle cx="380" cy="100" r="120" stroke="rgba(253,171,31,.08)" stroke-width="1"/>
  </svg>
  <p class="hero-band__kicker" data-slot="kicker">Section Label</p>
  <div class="hero-band__bar"></div>
  <h1 class="hero-band__title" data-slot="title">Slide Headline Goes Here</h1>
  <p class="hero-band__sub" data-slot="subtitle">Supporting subtitle or context sentence beneath the main title</p>
</div>
