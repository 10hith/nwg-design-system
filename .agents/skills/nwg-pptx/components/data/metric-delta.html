<!-- metric-delta | data | Primary metric with directional delta badge (up/down + label) -->
<style>
.metric-delta{display:flex;flex-direction:column;gap:6px}
.metric-delta__value{font-family:var(--display);font-size:52px;font-weight:800;color:var(--p800);line-height:1;margin:0}
.metric-delta__label{font-size:14px;color:var(--n700);margin:0}
.metric-delta__badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:800;width:fit-content;margin-top:4px}
.metric-delta__badge.up{background:rgba(79,168,106,.12);color:var(--ok)}
.metric-delta__badge.down{background:rgba(228,62,110,.1);color:var(--danger)}
.metric-delta__badge.neutral{background:var(--p100);color:var(--p700)}
</style>
<!-- UX_ANNOTATION_SLOT -->
<div class="metric-delta">
  <p class="metric-delta__value" data-slot="value">50 GB</p>
  <p class="metric-delta__label" data-slot="label">Free public repo storage / month</p>
  <span class="metric-delta__badge up" data-slot="delta">▲ Always free · no expiry</span>
</div>
