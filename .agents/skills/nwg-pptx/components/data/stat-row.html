<!-- stat-row | data | Horizontal strip of 3–4 stat-tiles sharing a common topic -->
<style>
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.stat-row .stat-tile{background:var(--p050);border:1px solid var(--p200);border-radius:16px;padding:28px 26px 22px;display:flex;flex-direction:column}
.stat-row .stat-tile__accent{width:40px;height:4px;background:var(--gold);border-radius:2px;margin-bottom:18px}
.stat-row .stat-tile__value{font-family:var(--display);font-size:48px;font-weight:800;color:var(--p800);line-height:1;margin:0 0 10px}
.stat-row .stat-tile__label{font-size:14px;color:var(--n700);margin:0;line-height:1.4}
</style>
<!-- UX_ANNOTATION_SLOT -->
<div class="stat-row" data-slot="stats">
  <div class="stat-tile">
    <div class="stat-tile__accent"></div>
    <p class="stat-tile__value" data-slot="value">500 MB</p>
    <p class="stat-tile__label" data-slot="label">Free private storage / month (new customers)</p>
  </div>
  <div class="stat-tile">
    <div class="stat-tile__accent"></div>
    <p class="stat-tile__value" data-slot="value">50 GB</p>
    <p class="stat-tile__label" data-slot="label">Free public storage / month (all customers)</p>
  </div>
  <div class="stat-tile">
    <div class="stat-tile__accent"></div>
    <p class="stat-tile__value" data-slot="value">5 TB</p>
    <p class="stat-tile__label" data-slot="label">Free public data transfer / month (with AWS account)</p>
  </div>
</div>
