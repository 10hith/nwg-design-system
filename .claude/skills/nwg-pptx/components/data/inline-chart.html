<!-- inline-chart | data | Compact self-contained SVG bar chart using token palette -->
<style>
.inline-chart{display:flex;flex-direction:column;gap:8px}
.inline-chart__bars{display:flex;align-items:flex-end;gap:10px;height:120px}
.inline-chart__bar-wrap{display:flex;flex-direction:column;align-items:center;flex:1;height:100%;justify-content:flex-end;gap:6px}
.inline-chart__bar{width:100%;background:var(--p300);border-radius:6px 6px 0 0}
.inline-chart__bar.hi{background:var(--p700)}
.inline-chart__cap{font-family:var(--display);font-size:13px;font-weight:800;color:var(--p800)}
.inline-chart__labels{display:flex;gap:10px}
.inline-chart__label-item{flex:1;text-align:center;font-size:12px;color:var(--n700)}
</style>
<!-- UX_ANNOTATION_SLOT -->
<div class="inline-chart" data-slot="chart">
  <div class="inline-chart__bars">
    <div class="inline-chart__bar-wrap">
      <span class="inline-chart__cap">$0.09</span>
      <div class="inline-chart__bar" style="height:55%"></div>
    </div>
    <div class="inline-chart__bar-wrap">
      <span class="inline-chart__cap">$0.085</span>
      <div class="inline-chart__bar" style="height:48%"></div>
    </div>
    <div class="inline-chart__bar-wrap">
      <span class="inline-chart__cap">$0.07</span>
      <div class="inline-chart__bar" style="height:38%"></div>
    </div>
    <div class="inline-chart__bar-wrap">
      <span class="inline-chart__cap">$0.05</span>
      <div class="inline-chart__bar hi" style="height:28%"></div>
    </div>
  </div>
  <div class="inline-chart__labels">
    <span class="inline-chart__label-item">9.999 TB</span>
    <span class="inline-chart__label-item">40 TB</span>
    <span class="inline-chart__label-item">100 TB</span>
    <span class="inline-chart__label-item">&gt;150 TB</span>
  </div>
</div>
