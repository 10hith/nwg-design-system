<!-- divider-bar | structural | Horizontal section separator with optional centred label pill -->
<style>
.divider-bar{display:flex;align-items:center;gap:18px;margin:20px 0}
.divider-bar__line{flex:1;height:1px;background:var(--p200)}
.divider-bar__pill{background:var(--p800);color:var(--n0);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:6px 16px;border-radius:999px;white-space:nowrap}
</style>
<!-- UX_ANNOTATION_SLOT -->
<div class="divider-bar">
  <div class="divider-bar__line"></div>
  <div class="divider-bar__pill" data-slot="label">Section Label</div>
  <div class="divider-bar__line"></div>
</div>
